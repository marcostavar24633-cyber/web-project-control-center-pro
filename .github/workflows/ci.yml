name: CI

on:
  push:
    branches: [main, v2-foundation]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/SECURITY.md
          test -f docs/MVP-1.0.0-AUDIT.md
          test -f docs/TRANSFER-NOTES.md
          test -f apps/api/src/audits.controller.ts
          test -f .github/workflows/ci.yml
          echo "Foundation repository files are present."

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check workspace presence
        id: workspace
        shell: bash
        run: |
          if [[ -f package.json && -f pnpm-workspace.yaml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace source is not imported yet; full validation is skipped."
          fi
      - name: Setup Node.js
        if: steps.workspace.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        if: steps.workspace.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm db:generate
      - name: Typecheck
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm typecheck
      - name: Build
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm build
