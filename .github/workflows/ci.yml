name: CI

on:
  push:
    branches: [main, v2-foundation]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/**'
      - 'packages/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/SECURITY.md
          test -f docs/MVP-1.0.0-AUDIT.md
          test -f docs/TRANSFER-NOTES.md
          test -f apps/api/src/audits.controller.ts
          test -f .github/workflows/ci.yml
          echo "Foundation repository files are present."

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: control
          POSTGRES_PASSWORD: control_dev_password
          POSTGRES_DB: control_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control -d control_center"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://control:control_dev_password@localhost:5432/control_center?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check workspace presence
        id: workspace
        shell: bash
        run: |
          if [[ -f package.json && -f pnpm-workspace.yaml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace source is not imported yet; full validation is skipped."
          fi
      - name: Setup Node.js
        if: steps.workspace.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        if: steps.workspace.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm db:generate
      - name: Apply database migrations to clean PostgreSQL
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm --filter @control/database exec prisma migrate deploy
      - name: Typecheck
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm typecheck
      - name: Build
        if: steps.workspace.outputs.exists == 'true'
        run: pnpm build
      - name: Runtime smoke test (API, PostgreSQL, Redis, Worker)
        if: steps.workspace.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/dist/main.js > /tmp/control-api.log 2>&1 &
          API_PID=$!
          node apps/worker/dist/main.js > /tmp/control-worker.log 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$API_PID" "$WORKER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4000/api/health >/tmp/control-health.json; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/control-api.log
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:4000/api/health
          curl --fail --silent http://127.0.0.1:4000/api/projects > /tmp/control-projects.json
          node -e "const x=require('/tmp/control-projects.json'); if (!Array.isArray(x)) process.exit(1)"
          kill -0 "$WORKER_PID"
          echo "API health, database-backed projects endpoint and Worker process are responding."
